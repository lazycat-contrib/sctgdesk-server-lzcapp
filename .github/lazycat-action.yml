version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/sctgdesk-server.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: hbbs
build:
  run_buildscript: false
images:
  - id: hbbs
    target: service
    service: hbbs
    source: sctg/sctgdesk-server
    channel: custom
    sort: semver
    tag_regex: '^1\.1\.99\.\d+$'
    version_regex: '^1\.1\.99\.(?P<version>\d+)$'
    version_template: '1.1.99-{version}'
    delivery:
      mode: lazycat
  - id: hbbr
    target: service
    service: hbbr
    source: sctg/sctgdesk-server
    channel: custom
    sort: semver
    tag_regex: '^1\.1\.99\.\d+$'
    version_regex: '^1\.1\.99\.(?P<version>\d+)$'
    version_template: '1.1.99-{version}'
    delivery:
      mode: lazycat
stores:
  official:
    enabled: true
    skip_if_version_exists: true
    changelog_locales: [zh, en]
  private:
    enabled: true
    skip_if_version_exists: true
    name: SctgDesk Server
    summary: "一个修改版的 RustDesk 服务器程序"
